{% extends 'base.html' %}
{% load static %}
{% block content %}
  <style>
    .signupform {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      padding: 20px;
    }

    .signupcard-body {
      width: 100%;
      max-width: 320px;
      background-color: #f7f7f7;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .paints-header h1 {
      font-size: 60px;
    }

    .hr--large {
      border: none;
      height: 1.5px;
      background-color: #5e5e5e;
      margin: 20px auto;
      width: 5%;
    }

    @media (max-width: 768px) {
      .paints-header h1 {
        font-size: 40px;
      }
      .hr--large {
        width: 10%;
      }
      .signupcard-body {
        padding: 15px;
      }
    }

    @media (max-width: 480px) {
      .paints-header h1 {
        font-size: 30px;
      }
      .hr--large {
        width: 15%;
      }
      .form-label {
        font-size: 14px;
      }
      .btn-warning {
        width: 100%;
      }
    }
  </style>

  <div class="paints-header text-center mt-3 font-weight-bold">
    <h1>Log In</h1>
    <hr class="hr--large" />
  </div>
  <form class="signupform" method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="card bg-secondary mb-1">
      <div class="signupcard-body">
        {% if error %}
          <div class="alert alert-danger" role="alert">
            <small>{{ error }}</small>
          </div>
        {% endif %}

        <div class="formgroup mb-1">
          <label for="username" class="form-label mt-3">Username</label>
          <input type="text" name="username" id="username" class="form-control" placeholder="Username" required autofocus />
        </div>

        <div class="formgroup mb-1">
          <label for="password" class="form-label mt-3">Password</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="••••••••••" required />
          <button type="submit" class="btn btn-warning mt-4">Log In</button>
          <p class="mt-3 mb-2 text-secondary-emphasis">Don't have an account? <a class="text-warning" href="{% url 'signup' %}">Sign Up</a></p>
        </div>
      </div>
    </div>
  </form>
{% endblock %}
